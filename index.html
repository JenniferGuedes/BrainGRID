<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainGRID</title>
    <link rel="icon" type="image" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table class="header" width="100%" cellpadding="10">
        <tr>
            <td width="50">
                <img src="assets/favicon.png" alt="Logo" width="60" height="60">
            </td>
            <td>
                <h1 class="logoText">BrainGrid</h1>
            </td>
        </tr>

    <main>
        <!--Calendar navigation-->
        <button onclick="prevMonth()">◀</button> 
        <span id="monthYear"></span> 
        <button onclick="nextMonth()">▶</button>
        <table border="1" id="calendar">
            <tr>
                <th>Dom</th>
                <th>Seg</th>
                <th>Ter</th>
                <th>Qua</th>
                <th>Qui</th>
                <th>Sex</th>
                <th>Sáb</th>  
            </tr>
        </table>

        <button onclick="login()">Login com Google</button>
        <ul id="agenda"></ul>
    </main>
    
    
    <script src="https://apis.google.com/js/api.js"></script></script>
    <script src="script.js"></script>
</body>
</html>
