<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainGRID</title>
    <link rel="icon" type="image" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table class="header" width="100%" cellpadding="10">
        <tr>
            <td width="50">
                <img src="assets/favicon.png" alt="Logo" width="60" height="60">
            </td>
            <td>
                <h1 class="logoText">BrainGrid</h1>
            </td>
        </tr>
    </table>

    <main>

         <button class="loginGoogle" onclick="login()">Login com Google</button>

         <img id="userIcon" src="assets/accLog.svg" alt="Perfil" style="display:none; width:40px; height:40px; cursor:pointer;">

        <!--Calendar navigation-->
         <h2>Planejamento da Semana</h2>
        <button class="monthButton" onclick="prevWeek()">◀</button> 
        <span id="monthYear"></span> 
        <button class="monthButton" onclick="nextWeek()">▶</button>
        <table border="1" id="calendar">
            <tr>
                <th>Dom</th>
                <th>Seg</th>
                <th>Ter</th>
                <th>Qua</th>
                <th>Qui</th>
                <th>Sex</th>
                <th>Sáb</th>  
            </tr>
        </table>

        <ul id="agenda"></ul>

        <section id="tasks">
            <h2>Tarefas</h2>
            <button id="addTask">+ Add task</button>
            <ul id="taskList"></ul>
        </section>

        <h2>Slots</h2>
        <section class="slots">
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
        </section>



    </main>
    
    
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
